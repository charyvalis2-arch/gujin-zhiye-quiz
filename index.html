['again','quit'].forEach(id=>$(id).addEventListener('click',()=>setTimeout(renderHome,0)));

/* --- 列印 --- */
function qBlock(q,n,showAns){return '<div class="item"><div><b>'+(showAns?'':'（　）')+n+'. '+esc(q.q)+'</b></div>'+q.opts.map((t,j)=>'<div>（'+LET[j]+'）'+esc(t)+'</div>').join('')+'</div>'}
function ansBlock(items){return '<h2 style="break-before:page">解答與解析</h2>'+items.map((q,k)=>'<p>'+(k+1)+'. '+LET[q.a]+'　'+esc(q.opts[q.a])+'　'+esc(q.exp)+'</p>').join('')}
function sheetWB(){const w=wbList();
 openX('<div class="noprint"><button class="pri" onclick="print()">🖨 列印／存成 PDF</button> <button onclick="closeX()">返回</button></div><div class="sheet"><h1>我的錯題卷</h1><p>班級＿＿　座號＿＿　姓名＿＿</p>'+w.map((q,k)=>qBlock(q,k+1)).join('')+ansBlock(w)+'</div>')}
function psheet(tc){const it=BK.items;
 openX('<div class="noprint"><button class="pri" onclick="print()">🖨 列印／存成 PDF</button> <button onclick="bank()">返回抽題區</button></div><div class="sheet"><h1>'+esc(TTL)+'　抽題卷（'+(tc?'教師版':'學生版')+'）</h1><p>'+(tc?'含解答與解析':'班級＿＿　座號＿＿　姓名＿＿　得分＿＿')+'</p>'+it.map((q,k)=>qBlock(q,k+1)).join('')+(tc?ansBlock(it):'')+'</div>')}

/* --- 題庫抽題與下載區 --- */
const BK={sel:new Set(CATS.map(c=>c.k)),n:20,items:null};
function bank(){document.body.classList.remove('proj');
 openX('<h1>📥 題庫抽題與下載區</h1><p class="sub">自選範圍與題數抽出一份題組，再分別下載「學生版」與「教師版」（兩份來自同一次抽題）</p><div class="panel"><b>① 選範圍</b>'+
  CATS.map(c=>'<label style="display:block;margin:4px 0"><input type="checkbox" data-k="'+c.k+'" '+(BK.sel.has(c.k)?'checked':'')+'> <span style="color:'+c.color+';font-weight:700">'+esc(c.n)+'</span>（'+POOL.filter(q=>q.cat===c.k).length+' 題）</label>').join('')+
  '<b>② 題數</b> <input id="nn" type="number" min="5" max="60" value="'+BK.n+'" style="width:72px;font:inherit"> 題<div class="row"><button class="pri" id="dr">🎲 抽題</button><button onclick="closeX()">返回首頁</button></div></div><div id="out"></div>');
 X.querySelectorAll('[data-k]').forEach(c=>c.onchange=()=>{c.checked?BK.sel.add(c.dataset.k):BK.sel.delete(c.dataset.k)});
 $('dr').onclick=draw;if(BK.items)bshow()}
function draw(){BK.n=Math.max(5,Math.min(60,+$('nn').value||20));
 const ks=CATS.map(c=>c.k).filter(k=>BK.sel.has(k));
 if(!ks.length){$('out').innerHTML='<div class="panel">請至少選一個範圍。</div>';return}
 BK.items=shuf(POOL.filter(q=>ks.includes(q.cat))).slice(0,BK.n).map(mixQ).sort((a,b)=>ks.indexOf(a.cat)-ks.indexOf(b.cat));bshow()}
function bshow(){const it=BK.items;
 $('out').innerHTML='<div class="panel"><b>已抽出 '+it.length+' 題</b>'+(it.length<BK.n?'<span class="mut">（所選範圍題庫不足 '+BK.n+' 題，已全部抽出）</span>':'')+
  '<div style="max-height:260px;overflow:auto;margin-top:8px;font-size:15px">'+it.map((q,k)=>'<p>'+(k+1)+'. '+esc(q.q)+'</p>').join('')+'</div></div>'+
  '<div class="panel" style="border-color:#1c7ed6"><b>🧒 學生版</b> <span class="mut">題目卷，答案欄空白，有姓名座號欄</span><div class="row"><button class="pri" data-d="0">下載 Word</button><button data-p="0">列印／存成 PDF</button></div></div>'+
  '<div class="panel" style="border-color:#c2477a"><b>👩‍🏫 教師版</b> <span class="mut">題目＋最後一頁解答與解析</span><div class="row"><button class="pri" data-d="1">下載 Word</button><button data-p="1">列印／存成 PDF</button></div></div><p id="bkmsg" class="mut"></p>';
 X.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>dl(+b.dataset.d));X.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>psheet(+b.dataset.p))}
const XE=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function docxXml(items,tc){const F='<w:rFonts w:ascii="Microsoft JhengHei" w:eastAsia="Microsoft JhengHei" w:hAnsi="Microsoft JhengHei"/>';
 const P=(t,o={})=>'<w:p><w:pPr>'+(o.c?'<w:jc w:val="center"/>':'')+(o.ind?'<w:ind w:left="400"/>':'')+'<w:spacing w:after="'+(o.ind?140:40)+'"/></w:pPr><w:r><w:rPr>'+F+(o.b?'<w:b/>':'')+(o.col?'<w:color w:val="'+o.col+'"/>':'')+'<w:sz w:val="'+(o.sz||22)+'"/></w:rPr><w:t xml:space="preserve">'+XE(t)+'</w:t></w:r></w:p>';
 let b=P(TTL+'　抽題卷（'+(tc?'教師版':'學生版')+'）',{b:1,sz:36,col:'B3261E',c:1});
 b+=P(tc?'共 '+items.length+' 題・含解答與解析':'班級：＿＿＿＿　座號：＿＿＿＿　姓名：＿＿＿＿＿＿　得分：＿＿＿＿',{col:'666666'});
 items.forEach((q,k)=>{b+=P('（　）'+(k+1)+'. '+q.q,{b:1});b+=P(q.opts.map((t,j)=>'('+LET[j]+') '+t).join('　　'),{ind:1})});
 if(tc){b+='<w:p><w:r><w:br w:type="page"/></w:r></w:p>'+P('解答與解析',{b:1,sz:32,col:'1E8A4C'});
  items.forEach((q,k)=>{b+=P((k+1)+'. '+LET[q.a]+'　'+q.opts[q.a]+'　'+q.exp,{ind:1})})}
 return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+b+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1020" w:right="1020" w:bottom="1020" w:left="1020" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>'}
async function mkDocx(items,tc){const z=new JSZip();
 z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
 z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
 z.file('word/document.xml',docxXml(items,tc));return z.generateAsync({type:'blob'})}
async function dl(tc){const m=$('bkmsg');
 try{const bl=await mkDocx(BK.items,!!tc),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=(tc?'教師版':'學生版')+'_'+TTL+'抽題卷.docx';document.body.appendChild(a);a.click();a.remove();m.textContent='✅ 已下載'}
 catch(e){m.textContent='下載失敗，請改用「列印／存成 PDF」。'}}

/* --- 上課投影模式 --- */
function proj(ck){document.body.classList.add('proj');
 const mk=()=>shuf(POOL.filter(q=>ck==='all'||q.cat===ck)).map(mixQ);
 let qs=mk(),k=0,rev=0,tm=[0,0,0,0];
 const label=ck==='all'?'🎯 全部':'▶ '+catOf(ck).n;
 const render=()=>{const q=qs[k],c=catOf(q.cat);
  X.innerHTML='<div class="hdr"><b>'+esc(label)+'</b><span class="mut">第 '+(k+1)+' / '+qs.length+' 題　［空白鍵：揭曉／下一題　Esc：離開］</span><button id="pjx">離開</button></div>'+
   '<div class="panel"><div style="font-size:1rem;font-weight:700;color:'+c.color+'">'+(q.star?'★ ':'')+esc(c.n)+'</div><div class="pj">'+esc(q.q)+'</div>'+
   q.opts.map((t,j)=>'<div class="pjo '+(rev&&j===q.a?'ok':'')+'"><b>'+LET[j]+'</b>　'+esc(t)+'</div>').join('')+
   '<div class="pjex '+(rev?'on':'')+'">'+esc(q.exp)+'</div></div>'+
   '<p><button class="pri" id="pjgo" style="font-size:1.2rem;padding:10px 24px">'+(rev?'下一題 ➜':'揭曉答案')+'</button></p>'+
   '<div class="tmw">'+tm.map((v,j)=>'<div>第'+(j+1)+'組<b>'+v+'</b><button data-t="'+j+'">＋1</button> <button data-m="'+j+'">－1</button></div>').join('')+'</div>';
  $('pjx').onclick=closeX;$('pjgo').onclick=nx;
  X.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tm[+b.dataset.t]++;render()});
  X.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{tm[+b.dataset.m]--;render()})};
 const nx=()=>{if(!rev)rev=1;else{rev=0;k++;if(k>=qs.length){qs=mk();k=0}}render()};
 document.onkeydown=e=>{if(e.code==='Space'){e.preventDefault();nx()}else if(e.key==='Escape')closeX()};
 openX('');render()}
</script></body></html>
